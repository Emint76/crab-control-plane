name: knowledge-admission-skill-validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  knowledge-admission-skill-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate knowledge-admission skill package
        run: make knowledge-admission-skill-validate
