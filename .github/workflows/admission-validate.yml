name: admission-validate

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  admission-validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install current repo validation requirements
        run: python -m pip install -r operations/harness-phase2/requirements.txt

      - name: Validate admission shell syntax
        run: |
          bash -n operations/admission/tests/test_admission_contracts.sh
          bash -n operations/admission/tests/test_stage2_handoff.sh

      - name: Validate admission contracts
        run: bash operations/admission/tests/test_admission_contracts.sh

      - name: Validate admission handoff examples
        run: bash operations/admission/tests/test_stage2_handoff.sh
